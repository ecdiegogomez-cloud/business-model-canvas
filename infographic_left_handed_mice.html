<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Model Canvas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Palette: Ultra Minimalist Monochrome with Soft Accents */
            --bg-body: #0a0a0a;
            --bg-segment: #111111;
            --bg-card: #1a1a1a;
            --bg-hover: #222222;

            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-muted: #444444;

            --border: #222222;
            --accent: #ffffff;

            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .status {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: 12px;
        }

        .status-dot {
            width: 4px;
            height: 4px;
            background: var(--text-muted);
            border-radius: 50%;
        }

        .status.online .status-dot {
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        button:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        button.primary {
            background: var(--accent);
            color: var(--bg-body);
            border-color: var(--accent);
        }

        button.primary:hover {
            background: #eeeeee;
        }

        /* --- Grid --- */
        .canvas-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }

        .segment {
            background: var(--bg-segment);
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 250px;
            transition: background 0.2s;
        }

        .segment.drag-over {
            background: var(--bg-card);
        }

        .segment-title {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-icon {
            cursor: help;
            opacity: 0.8;
            color: #FFD700;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .info-icon:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .segment-desc {
            display: none;
            font-size: 0.75rem;
            color: #FFD700;
            line-height: 1.4;
            margin-top: 8px;
            padding: 8px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 4px;
            text-transform: none;
            letter-spacing: normal;
            font-weight: 400;
        }

        .segment-desc.visible {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .add-btn {
            border: none;
            padding: 0;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1;
        }

        .add-btn:hover {
            color: var(--text-primary);
        }

        /* --- Positions --- */
        .kp {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }

        .ka {
            grid-column: 3 / 5;
            grid-row: 1 / 2;
        }

        .kr {
            grid-column: 3 / 5;
            grid-row: 2 / 3;
        }

        .vp {
            grid-column: 5 / 7;
            grid-row: 1 / 3;
        }

        .cr {
            grid-column: 7 / 9;
            grid-row: 1 / 2;
        }

        .ch {
            grid-column: 7 / 9;
            grid-row: 2 / 3;
        }

        .cs {
            grid-column: 9 / 11;
            grid-row: 1 / 3;
        }

        .cst {
            grid-column: 1 / 6;
            grid-row: 3 / 4;
            min-height: 180px;
        }

        .rs {
            grid-column: 6 / 11;
            grid-row: 3 / 4;
            min-height: 180px;
        }

        /* --- List & Cards --- */
        .item-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .card {
            background: var(--bg-segment);
            padding: 10px 0;
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-primary);
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #1a1a1a;
            transition: var(--transition);
        }

        .card:last-child {
            border-bottom: none;
        }

        .card:hover {
            padding-left: 8px;
            background: var(--bg-card);
        }

        .card.dragging {
            opacity: 0.3;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover .card-actions {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .icon-btn:hover {
            color: var(--text-primary);
        }

        .icon-btn.delete-btn:hover {
            color: #ff4444;
        }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--bg-segment);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .modal-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 15px;
            font-family: inherit;
            font-size: 0.9rem;
            min-height: 120px;
            resize: none;
            outline: none;
            margin-bottom: 20px;
        }

        textarea:focus {
            border-color: var(--text-secondary);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        /* --- Toast --- */
        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: none;
        }

        @media (max-width: 1200px) {
            .canvas-grid {
                display: flex;
                flex-direction: column;
                background: transparent;
                gap: 20px;
                border: none;
            }

            .segment {
                border: 1px solid var(--border);
            }
        }

        @media print {
            body {
                background: white;
                color: black;
                padding: 0;
            }

            .controls,
            .add-btn,
            .card-actions {
                display: none !important;
            }

            .canvas-grid {
                background: #eee;
                border: 1px solid #eee;
            }

            .segment {
                background: white;
                border: none;
            }

            .card {
                color: black;
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Yoga Socks Strategy Canvas</h1>
            <div class="controls">
                <div id="status" class="status">
                    <span class="status-dot"></span>
                    <span id="status-label">connecting</span>
                </div>
                <button onclick="resetData()">Reset</button>
                <button onclick="shareCanvas()">Share</button>
                <button class="primary" onclick="window.print()">Export</button>
            </div>
        </header>

        <main class="canvas-grid" id="canvas-root">
            <!-- JS -->
        </main>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="modal-title">New Entry</div>
            <textarea id="modal-input" spellcheck="false"></textarea>
            <div class="modal-footer">
                <button onclick="closeModal()">Cancel</button>
                <button class="primary" onclick="saveItem()">Apply</button>
            </div>
        </div>
    </div>

    <div id="toast">Synchronized</div>

    <!-- <script src="/socket.io/socket.io.js"></script> -->
    <script>
        // const socket = io(); // Disabled for standalone

        const structure = [
            { id: 'kp', title: 'Key Partners', desc: 'Who are your key partners and suppliers?', class: 'kp' },
            { id: 'ka', title: 'Key Activities', desc: 'What key activities does your value proposition require?', class: 'ka' },
            { id: 'kr', title: 'Key Resources', desc: 'What key resources does your value proposition require?', class: 'kr' },
            { id: 'vp', title: 'Value Propositions', desc: 'What value do you deliver to the customer?', class: 'vp' },
            { id: 'cr', title: 'Customer Relationships', desc: 'What type of relationship does each customer segment expect?', class: 'cr' },
            { id: 'ch', title: 'Channels', desc: 'Through which channels do your customer segments want to be reached?', class: 'ch' },
            { id: 'cs', title: 'Customer Segments', desc: 'For whom are you creating value?', class: 'cs' },
            { id: 'cst', title: 'Cost Structure', desc: 'What are the most important costs inherent in your business model?', class: 'cst' },
            { id: 'rs', title: 'Revenue Streams', desc: 'For what value are your customers really willing to pay?', class: 'rs' }
        ];

        // Hardcoded Data for Yoga Socks
        let currentData = {
            kp: ['Suppliers/Manufacturers (China)', '3PL Logistics (Cubbo/Amazon FBA)', 'Ecommerce Platforms (Shopify)'],
            ka: ['Product Sourcing', 'Content Creation (Social/Blog)', 'Order Fulfillment', 'Customer Support'],
            kr: ['Inventory', 'Digital Infrastructure (Web/Domain)', 'Email List'],
            vp: ['Anti-slip & Hygiene Solution', 'Niche Availability', 'Improved Design (Grip/Material)'],
            cr: ['Community Engagement (UGC)', 'Email Marketing (Retention)'],
            ch: ['DTC Website', 'Marketplaces (Amazon/eBay)', 'Social Media (Instagram/TikTok)'],
            cs: ['Women ~35', 'Suburban', 'Married w/ Kids', 'Wellness-focused'],
            cst: ['COGS (Manufacturing/Import)', 'Platform & Hosting Fees', 'Marketing Ads', 'Transaction Fees'],
            rs: ['Product Sales', 'Bundling (AOV Growth)', 'Subscriptions (Replenishment)']
        };
        
        let dragSrc = null;
        let editCtx = null;

        // Initialize immediately
        document.addEventListener('DOMContentLoaded', () => {
             document.getElementById('status').classList.add('online');
             document.getElementById('status-label').textContent = 'local mode';
             buildGrid();
             render();
        });

        /*
        // --- Socket ---
        socket.on('connect', () => {
            document.getElementById('status').classList.add('online');
            document.getElementById('status-label').textContent = 'live';
        });

        socket.on('disconnect', () => {
            document.getElementById('status').classList.remove('online');
            document.getElementById('status-label').textContent = 'offline';
        });

        socket.on('init_data', data => {
            currentData = data;
            buildGrid();
            render();
        });

        socket.on('canvas_updated', data => {
            currentData = data;
            render();
            showToast();
        });
        */

        // --- Logic ---
        function buildGrid() {
            const root = document.getElementById('canvas-root');
            root.innerHTML = '';
            structure.forEach(s => {
                const el = document.createElement('div');
                el.className = `segment ${s.class}`;
                el.setAttribute('data-id', s.id);
                el.innerHTML = `
                    <div class="segment-title">
                        <div class="title-group">
                            ${s.title}
                            <span class="info-icon" onclick="toggleDesc('${s.id}')" title="More info">ⓘ</span>
                        </div>
                        <button class="add-btn" onclick="openModal('${s.id}')">+</button>
                    </div>
                    <div id="desc-${s.id}" class="segment-desc">${s.desc}</div>
                    <div class="item-list" id="list-${s.id}"></div>
                `;
                el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
                el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
                el.addEventListener('drop', handleDrop);
                root.appendChild(el);
            });
        }

        function render() {
            if (!currentData) return;
            structure.forEach(s => {
                const list = document.getElementById(`list-${s.id}`);
                list.innerHTML = '';
                (currentData[s.id] || []).forEach((text, idx) => {
                    list.appendChild(createCard(text, s.id, idx));
                });
            });
        }

        function createCard(text, listId, idx) {
            const card = document.createElement('div');
            card.className = 'card';
            card.draggable = true;
            card.innerHTML = `
                <span>${text}</span>
                <div class="card-actions">
                    <button class="icon-btn" onclick="openModal('${listId}', ${idx})">Edit</button>
                    <button class="icon-btn delete-btn" onclick="deleteItem('${listId}', ${idx})">Delete</button>
                </div>
            `;
            card.addEventListener('dragstart', () => {
                dragSrc = { text, listId, idx };
                card.classList.add('dragging');
            });
            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                document.querySelectorAll('.segment').forEach(s => s.classList.remove('drag-over'));
            });
            card.addEventListener('dblclick', () => openModal(listId, idx));
            return card;
        }

        function handleDrop(e) {
            e.preventDefault();
            const target = e.target.closest('.segment');
            if (target && dragSrc) {
                const targetId = target.getAttribute('data-id');
                currentData[dragSrc.listId].splice(dragSrc.idx, 1);
                if (!currentData[targetId]) currentData[targetId] = [];
                currentData[targetId].push(dragSrc.text);
                save();
            }
            dragSrc = null;
        }

        function deleteItem(listId, idx) {
            currentData[listId].splice(idx, 1);
            save();
        }

        function save() {
            // socket.emit('update_canvas', currentData);
            render();
            showToast(); // Simulate save feedback
        }

        function resetData() {
            if (confirm('Reset canvas?')) {
                // Reset to empty or default
                // socket.emit('reset_canvas');
                location.reload(); 
            }
        }

        function toggleDesc(id) {
            const el = document.getElementById(`desc-${id}`);
            if (el) el.classList.toggle('visible');
        }

        // --- Modal ---
        const modal = document.getElementById('modal');
        const input = document.getElementById('modal-input');

        function openModal(listId, idx = null) {
            editCtx = { listId, idx };
            document.getElementById('modal-title').textContent = idx === null ? 'New Entry' : 'Edit Entry';
            input.value = idx === null ? '' : currentData[listId][idx];
            modal.style.display = 'flex';
            input.focus();
        }

        function closeModal() { modal.style.display = 'none'; }

        function saveItem() {
            const val = input.value.trim();
            if (val) {
                if (editCtx.idx === null) {
                    if (!currentData[editCtx.listId]) currentData[editCtx.listId] = [];
                    currentData[editCtx.listId].push(val);
                } else {
                    currentData[editCtx.listId][editCtx.idx] = val;
                }
                save();
                closeModal();
            }
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 1500);
        }

        function shareCanvas() {
            navigator.clipboard.writeText(window.location.href);
            showToast();
        }

        modal.onclick = e => { if (e.target === modal) closeModal(); };
        input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveItem(); } };
    </script>
</body>

</html>
